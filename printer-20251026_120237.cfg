kick_start_time: 5.0
#heater: heater_bed
#heater_temp: 60
#fan_speed: 1.0 



[quad_gantry_level]
gantry_corners:
    -60,-10
    410,420
points:
    50,50
    50,300
    300,300
    300,50
    
    #--------------------------------------------------------------------
speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
